name: Pull request

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  HUSKY: '0'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

defaults:
  run:
    shell: bash

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: betterleaks
      - name: Scan the pull request's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: betterleaks git --log-opts="$BASE_SHA..$HEAD_SHA" --redact --no-banner -v --config .betterleaks.toml

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: zizmor
      - name: Lint the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github .

  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: shellcheck node
      # Every tracked *.sh file, the husky hooks (no shebang; each carries a shellcheck directive),
      # and every other tracked file whose first line is a sh or bash shebang.
      - name: Lint the shell scripts
        run: |
          scripts=()
          while IFS= read -r -d '' f; do
            [ -f "$f" ] || continue
            case "$f" in
              *.sh | .husky/pre-commit | .husky/post-merge | .husky/post-checkout | .husky/post-rewrite) scripts+=("$f") ;;
              *) if head -n 1 "$f" | grep -aqE '^#!.*[/ ](ba)?sh( |$)'; then scripts+=("$f"); fi ;;
            esac
          done < <(git ls-files -z)
          echo "shellcheck on ${#scripts[@]} scripts"
          shellcheck "${scripts[@]}"
      - name: Check the follow-stack hooks
        run: bash .github/scripts/check-follow-stack.sh

  js:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node pnpm
      - name: Find the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build
        run: pnpm build 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Fail on build warnings
        run: |
          if grep -nF '(!)' "$RUNNER_TEMP/build.log"; then
            echo "::error::pnpm build printed a (!) warning (lines above); a new one counts as a failure."
            exit 1
          fi

  dotnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: dotnet
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/Directory.Packages.props', 'backend/**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - run: dotnet tool restore
      # Directory.Build.props keeps TreatWarningsAsErrors off locally; CI enforces "0 warnings" here.
      - run: dotnet build backend/WattWise.slnx -warnaserror
      - run: dotnet ef migrations has-pending-model-changes --project backend/src/WattWise.Infrastructure --no-build
      - run: dotnet format backend/WattWise.slnx --verify-no-changes --no-restore
      # The integration tests start PostgreSQL with Testcontainers on the runner's Docker.
      - run: dotnet test --solution backend/WattWise.slnx --no-build

  api-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node pnpm dotnet
      - name: Find the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('backend/Directory.Packages.props', 'backend/**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:api
      - name: Fail when the generated files changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "::error::pnpm generate:api changed files. Run it and commit the OpenAPI document and the API client."
            exit 1
          fi

  images:
    name: images (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: Api
            dockerfile: backend/src/WattWise.Api/Dockerfile
            kind: dotnet
            healthcheck: 'true'
            debugger: 'true'
          - image: Jobs
            dockerfile: backend/src/WattWise.Jobs/Dockerfile
            kind: dotnet
            healthcheck: 'true'
            debugger: 'true'
          - image: Cli
            dockerfile: backend/src/WattWise.Cli/Dockerfile
            kind: dotnet
            healthcheck: 'false'
            debugger: 'false'
          - image: Frontend
            dockerfile: frontend/Dockerfile
            kind: web
            app: frontend
            debugger: 'false'
          - image: Admin
            dockerfile: admin/Dockerfile
            kind: web
            app: admin
            debugger: 'false'
    env:
      IMAGE: ${{ matrix.image }}
      DOCKERFILE: ${{ matrix.dockerfile }}
      HEALTHCHECK: ${{ matrix.healthcheck }}
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the dev target
        run: docker build -f "$DOCKERFILE" --target dev -t "image-dev" .
      - name: Build the build stage
        run: docker build -f "$DOCKERFILE" --target build -t "image-build" .
      - name: Build the runtime image
        run: docker build -f "$DOCKERFILE" -t "image-runtime" .
      - name: Assert the dev image's debugger
        if: matrix.debugger == 'true'
        run: bash .github/scripts/check-debugger.sh image-dev "$DOCKERFILE" "${IMAGE,,}" image-runtime image-build
      - name: Assert the images run as a non-root user
        run: |
          for image in image-dev image-runtime; do
            user="$(docker image inspect -f '{{.Config.User}}' "$image")"
            case "$user" in
              ''|root|0|0:*|root:*) echo "::error::$image runs as '$user', not as a non-root user."; exit 1 ;;
            esac
          done
      - name: Assert the .NET runtime image
        if: matrix.kind == 'dotnet'
        run: |
          project="WattWise.$IMAGE"
          health="$(docker image inspect -f '{{json .Config.Healthcheck}}' image-runtime)"
          if [ "$HEALTHCHECK" = true ] && [ "$health" = null ]; then
            echo "::error::The runtime image has no health check."
            exit 1
          fi
          if [ "$HEALTHCHECK" = true ]; then
            # The tools the HEALTHCHECK command uses (sh runs it, sed and curl are in it), found as the image's user.
            for tool in sh sed curl; do
              if ! docker run --rm --entrypoint sh -e TOOL="$tool" image-runtime -c 'command -v "$TOOL" > /dev/null'; then
                echo "::error::The runtime image has no $tool, which its health check needs."
                exit 1
              fi
            done
          fi
          for path in /app "/app/$project.dll"; do
            if ! docker run --rm --entrypoint sh -e CHECK_PATH="$path" image-runtime -c 'test -e "$CHECK_PATH" && test ! -w "$CHECK_PATH"'; then
              echo "::error::The runtime user can write $path."
              exit 1
            fi
          done
          # As the image's user: nothing under /app is unreadable and no directory lacks x. A failing find is an error.
          if ! unreadable="$(docker run --rm --entrypoint find image-runtime /app \( ! -readable -o \( -type d ! -executable \) \) -print)"; then
            echo "::error::Listing the unreadable paths under /app failed."
            exit 1
          fi
          if [ -n "$unreadable" ]; then
            echo "::error::The runtime user can't read or enter these paths under /app: $unreadable"
            exit 1
          fi
          sdks="$(docker run --rm --entrypoint sh image-runtime -c 'dotnet --list-sdks 2>/dev/null || true')"
          if [ -n "$sdks" ]; then
            echo "::error::The runtime image holds a .NET SDK: $sdks"
            exit 1
          fi
          find_settings="find / -xdev \( -name '.env*' -o -name 'appsettings.*.local.json' -o -name launchSettings.json \) 2>/dev/null || true"
          for image in image-runtime image-build; do
            found="$(docker run --rm --entrypoint sh "$image" -c "$find_settings")"
            if [ -n "$found" ]; then
              echo "::error::$image holds settings files: $found"
              exit 1
            fi
          done
      - name: Assert the web images hold no settings files
        if: matrix.kind == 'web'
        run: |
          # `.env*` anywhere, and `*.local` files where the app's sources and the served files are.
          find_settings="find / -xdev -name '.env*' 2>/dev/null; find /src /usr/share/nginx/html /etc/nginx -xdev \( -name '*.local' -o -name '*.local.*' \) 2>/dev/null || true"
          for image in image-runtime image-build; do
            found="$(docker run --rm --entrypoint sh "$image" -c "$find_settings")"
            if [ -n "$found" ]; then
              echo "::error::$image holds settings files: $found"
              exit 1
            fi
          done
      - name: Check the running web image
        if: matrix.kind == 'web'
        run: bash .github/scripts/check-web-image.sh image-runtime "$APP"

  setup:
    name: setup (${{ matrix.os-image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # One entry per distribution that runs the setup check. Another one adds an `install` key (its
        # package-manager line for git, the Docker CLI and Compose, curl, sudo, tar and libatomic) and an
        # `install-op` key (the official way to install the 1Password CLI there).
        include:
          - os-image: fedora:latest
    env:
      OS_IMAGE: ${{ matrix.os-image }}
      OS_INSTALL: ${{ matrix.install }}
      OS_INSTALL_OP: ${{ matrix.install-op }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Runs `mise run setup` twice on a throwaway container of the matrix image that has only git,
      # the Docker CLI and mise, then the eight development.md checks on it, with the runner's Docker
      # socket for Testcontainers.
      - name: Check mise run setup and the checks on a clean ${{ matrix.os-image }}
        env:
          # The job's read-only, ephemeral token, passed into the container by name only, to lift
          # mise's GitHub API rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=(--base "$OS_IMAGE")
          if [ -n "$OS_INSTALL" ]; then args+=(--install "$OS_INSTALL"); fi
          if [ -n "$OS_INSTALL_OP" ]; then args+=(--install-op "$OS_INSTALL_OP"); fi
          bash .github/scripts/check-setup.sh "${args[@]}"

  first-start:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Starts the Development compose file's db-init and cli under their own project, with
      # throwaway passwords: roles, migrations, a second start, no leaked password, failure paths.
      - name: Check the first start of the Development stack
        run: bash .github/scripts/check-first-start.sh

  # The one check main's ruleset requires. It has no name: key, so its check context is exactly "ci".
  # `images` holds the backend and the frontend and admin image builds (one matrix entry each).
  ci:
    needs: [secrets, workflows, shell, js, dotnet, api-client, images, setup, first-start]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null
