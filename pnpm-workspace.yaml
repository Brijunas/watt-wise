packages:
  - frontend
  - admin
  - packages/*

# Fail install when the Node/pnpm versions don't satisfy package.json "engines".
engineStrict: true

# Don't install versions published less than a day ago (minutes). Guards against compromised releases.
minimumReleaseAge: 1440

# Versions shared by frontend and admin, listed in their package.json (and the root's vite) as "catalog:".
catalog:
  react: ^19.3.1
  react-dom: ^19.3.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.3.0
  vite: ^8.3.8
  '@testing-library/react': ^16.3.3
  '@testing-library/dom': ^10.4.2
  jsdom: ^31.0.0
  '@mui/material': ^9.5.0
  '@mui/icons-material': ^9.5.0
  '@emotion/react': ^11.14.0
  '@emotion/styled': ^11.14.1
  '@fontsource-variable/roboto': ^5.3.0
  i18next: ^27.1.1
  react-i18next: ^18.0.1
  '@testing-library/user-event': ^14.6.9
  react-router: ^8.5.1
  i18next-browser-languagedetector: ^8.3.0
  '@reduxjs/toolkit': ^2.14.0
  react-redux: ^9.3.1
  msw: ^3.0.5
  zod: ^4.6.7
  react-hook-form: ^7.92.0
  '@hookform/resolvers': ^7.0.5
  vite-plugin-pwa: ^2.0.0
  workbox-window: ^7.4.1
  '@vite-pwa/assets-generator': ^2.0.0

# unrs-resolver (used by eslint-import-resolver-typescript) ships its native binary as an
# optional dependency; its postinstall script is only a fallback, so it doesn't run.
allowBuilds:
  unrs-resolver: false
