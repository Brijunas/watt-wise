# The static server of the frontend and admin images (deploy/docs/images.md, "nginx rules").
# No environment is read here: the per-container files (/config.js and index.html) are rendered by
# the stock envsubst entry point into /run/wattwise before nginx starts.
#
# Every location sets its own add_header: nginx drops the headers of an outer level as soon as an
# inner level sets one.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;

    # Vite's hashed output: a missing file is a 404, never index.html.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The deployment's own file. Not rendered (entry point bypassed) is a 404.
    location = /config.js {
        alias /run/wattwise/config.js;
        default_type text/javascript;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        alias /run/wattwise/index.html;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Any other path: a file (sw.js, workbox-*.js, icons) revalidates by ETag, anything else is a
    # client route and gets index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
