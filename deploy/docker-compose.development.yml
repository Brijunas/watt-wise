# Development environment: PostgreSQL, Grafana LGTM (traces, metrics and logs
# over OTLP) and Mailpit (catches every email the Api sends). Bind addresses, ports and
# user names come from 1Password, rendered into deploy/.env (read by compose automatically):
#   op inject -f -i deploy/development/compose.settings.tpl -o deploy/.env
# Passwords are read only on first start of empty volumes, through op run:
#   op run --env-file deploy/development/compose.env -- \
#     docker compose -f deploy/docker-compose.development.yml up -d --wait
# Application roles and their passwords are set up by hand once, see
# "Development database" in docs/setup.md.
name: wattwise-development

services:
  postgres:
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?render deploy/.env, see deploy/development/compose.settings.tpl}
      POSTGRES_DB: ${POSTGRES_DB:?render deploy/.env, see deploy/development/compose.settings.tpl}
      # Read only when the volume is empty (initdb); comes from op run, see compose.env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_statement=ddl
    ports:
      - '${POSTGRES_BIND_ADDRESS:?render deploy/.env, see deploy/development/compose.settings.tpl}:${POSTGRES_PORT:?render deploy/.env, see deploy/development/compose.settings.tpl}:5432'
    volumes:
      # PG 18 image layout: PGDATA is /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  lgtm:
    image: grafana/otel-lgtm:0.40.0
    restart: unless-stopped
    environment:
      # Grafana without a login (anonymous Admin); published on loopback only.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
    ports:
      - '${GRAFANA_BIND_ADDRESS:?render deploy/.env, see deploy/development/compose.settings.tpl}:${GRAFANA_PORT:?render deploy/.env, see deploy/development/compose.settings.tpl}:3000'
      # OTLP gRPC; the apps export traces, metrics and logs here.
      - '${OTLP_BIND_ADDRESS:?render deploy/.env, see deploy/development/compose.settings.tpl}:${OTLP_PORT:?render deploy/.env, see deploy/development/compose.settings.tpl}:4317'
    volumes:
      - lgtm-data:/data

  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    environment:
      # The Api always authenticates, as against Brevo; Mailpit accepts any credentials over plain SMTP. Published on loopback only.
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    ports:
      # SMTP; the Api sends its email here.
      - '${MAILPIT_SMTP_BIND_ADDRESS:?render deploy/.env, see deploy/development/compose.settings.tpl}:${MAILPIT_SMTP_PORT:?render deploy/.env, see deploy/development/compose.settings.tpl}:1025'
      # Web UI and API.
      - '${MAILPIT_BIND_ADDRESS:?render deploy/.env, see deploy/development/compose.settings.tpl}:${MAILPIT_PORT:?render deploy/.env, see deploy/development/compose.settings.tpl}:8025'
    # No volume: caught mail is throwaway.

volumes:
  postgres-data:
  lgtm-data:
