# Betterleaks configuration: the built-in rules plus two allowlists.
# Agreed exceptions only; see "Secrets and configuration" in docs/technical.md.

[extend]
useDefault = true

# 1Password secret references (op://vault/item/field) are pointers, not secrets.
# Only a whole KEY="op://..." line is allowed, so a literal value is still caught.
[[allowlists]]
description = "1Password secret references"
regexTarget = "line"
regexes = ['''^\s*[A-Za-z_][A-Za-z0-9_]*\s*=\s*"?op://[^"\s]+(\s[^"\s]+)*"?\s*$''']

# The generic-password rule flags UI labels (form.showPassword, form.hidePassword) in the
# locale files, route paths and error-code-to-i18n-key maps whose names contain "password",
# and password literals in test fixtures (TypeScript and C#). They are not secrets.
# Only that one rule is skipped, and only for these paths; every other rule still scans them.
[[allowlists]]
description = "Password labels, route paths, error keys and test password fixtures"
targetRules = ["generic-password"]
paths = [
  '''(^|/)locales/.+\.json$''',
  '''\.test\.tsx?$''',
  '''(^|/)backend/tests/.+\.cs$''',
  '''(^|/)frontend/src/config/routes\.ts$''',
  '''(^|/)admin/src/config/routes\.ts$''',
  '''(^|/)packages/core/src/errors/error-messages\.ts$''',
]
